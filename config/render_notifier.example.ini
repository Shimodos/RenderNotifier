; Render Notifier - пример конфига.
; Скопируйте в render_notifier.ini, заполните token и chat_id.
; Файл читается перед каждым рендером, перезапускать Max после правки не нужно.
; Кодировка файла - UTF-8.

[telegram]
; Токен бота от @BotFather
token=
; id чата (у групп отрицательный, у супергрупп начинается с -100)
chat_id=
; id темы (topic), если в группе включены темы. Иначе оставить пустым
thread_id=

; Свои имена компьютеров: ИМЯ_В_WINDOWS=как показывать в сообщениях.
; Один и тот же файл годится для всех машин - каждая берёт свою строку.
; Цветной значок в начале помогает различать машины в чате.
; Если машины нет в списке, показывается её имя Windows.
[computers]
;RENDER-01=🟦 Ферма 1
;RENDER-02=🟧 Ферма 2
;PC-ANNA=🟪 Анна

[options]
enabled=true
notify_start=true
notify_finish=true
; Не слать сообщение о завершении, если рендер короче порога (секунды)
min_duration_sec=0
; Как подписывать человека. Пусто - имя пользователя Windows
display_name=
; Таймаут запроса к Telegram, мс
timeout_ms=5000
; Сообщать, если 3ds Max закрылся или упал во время рендера
crash_watch=true
